<div class="login-container">
  <div class="login-card">
    <h2>{{ modoRegistro ? 'Crear Cuenta' : 'Iniciar Sesión' }}</h2>
    <p>Reseñas de Restaurantes</p>

    <form (ngSubmit)="onSubmit()">
      @if (modoRegistro) {
        <div>
          <label for="nombre">Nombre</label>
          <input
            id="nombre"
            type="text"
            name="nombre"
            [(ngModel)]="nombre"
            required
            placeholder="Tu nombre"
          />
        </div>
      }

      <div>
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="usuario@correo.com"
        />
      </div>

      <div>
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="********"
        />
      </div>

      @if (mensajeExito) {
        <p class="exito">{{ mensajeExito }}</p>
      }

      @if (errorMsg) {
        <p class="error">{{ errorMsg }}</p>
      }

      <button type="submit" [disabled]="cargando">
        {{
          cargando
            ? 'Procesando...'
            : modoRegistro
              ? 'Registrarse'
              : 'Entrar'
        }}
      </button>
    </form>

    <button type="button" class="toggle-btn" (click)="alternarModo()">
      {{
        modoRegistro
          ? '¿Ya tienes cuenta? Inicia sesión'
          : '¿No tienes cuenta? Regístrate'
      }}
    </button>
  </div>
</div>
